[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "avance_obra"
version = "0.1.0"
description = "Funciones del pipeline de monitorización del avance de obra en plantas fotovoltaicas (TFM)"
authors = [{ name = "Gonzalo Zubía López" }]
requires-python = ">=3.10"
dependencies = ["numpy", "requests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
